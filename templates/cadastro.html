{% extends "base.html" %}

{% block titulo %} Contato {% endblock %}

{% block conteudo %}

<main>
    <section class="contact">
        <div class="container container-box">
            <div class="contact-header">
                <h1 class="text-center">Sugestões</h1>
                <p>Envie ideias para melhorar este site não oficial!</p>
            </div>
            <form action="{{ url_for('cadastro') }}" class="contact-form" method="post">
                <div class="form-floating mb-3 mt-3">
                    <input type="email" class="form-control" id="email" placeholder="email" autocomplete="email" name="email">
                    <label for="email">Seu e-mail</label>
                </div>

                <div class="form-floating mb-3 mt-3">
                    <input type="type" class="form-control" id="titulo" placeholder="Título para sugestão" name="titulo">
                    <label for="sugestao">Título para sugestão</label>
                </div>

                <div class="form-floating mb-3 mt-3">
                    <textarea class="form-control" id="sugestao" name="sugestao" placeholder="sugestao"></textarea>
                    <label for="sugestao">Sugestão</label>
                </div>

                {% with messages = get_flashed_messages() %}
                    {% for message in messages %}
                        <div class="alert alert-danger alert-dismissible fade show">
                            {{ message }}
                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="alert">
                            </button>
                        </div>
                    {% endfor %}
                {% endwith %}

                <button class="btn-enviar">Enviar</button>
            </form>
        </div>
    </section>
</main>

{% endblock %}
