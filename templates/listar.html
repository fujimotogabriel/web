{% extends "base.html" %}

{% block titulo %} Sugestões {% endblock %}

{% block conteudo %}

<main>
    <ul>
        {% for sugestao in sugestoes %}
        <li>{{ sugestao.sug_email }} - {{ sugestao.sug_sugestao }}</li>
        {% else %}
        <li>Nenhuma sugestao encontrada.</li>
        {% endfor %}
    </ul>
</main>

{% endblock %}
