<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <title>{% block titulo %} {% endblock %}</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        crossorigin="anonymous"></script>

    </head>
    <body>

        <header class="sticky-top">
            <div class="container-fluid px-0">
               <nav class="navbar navbar-expand-sm bg-dark navbar-dark px-3 px-sm-4 px-md-5">
                    <!--Logo-->
                    
                    <a class="navbar-brand" href="/"><img src="{{ url_for ('static', filename='img/logo.png') }}" class="logo"></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="collapsibleNavbar">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="personagens">Personagens</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="contato">Contato</a>
                            </li>
                        </ul>
                        <div class="btn btn-success">
                            <i class="bi bi-cart"></i>
                            <a class="nav-link" style="display: inline" href="https://store.steampowered.com/app/1845250/Rubinite/">Comprar</a> 
                        </div>
                    </div>
                </nav>
            </div>
        </header>

        {% block conteudo %}{% endblock %}

        <footer>
            <p class="text-center font-monospace"> Gabriel - atividade 3</p>
        </footer>
    </body>
</html>
