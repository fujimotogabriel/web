<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=width-device, initial-scale=1.0">
        <title>Contato</title>
        <link rel="stylesheet" href="../css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>
    <body>
        <header class="sticky-top">
            <div class="container-fluid px-0">
                <nav class="navbar sticky-top navbar-expand-sm bg-dark navbar-dark  px-3 px-sm-4 px-md-5">
                    <!--Logo-->
                    
                    <a class="navbar-brand" href="../index.html"><img src="../imgs/Logo.png" class="logo"></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="collapsibleNavbar">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="personagens.html">Personagens</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="contato.html">Contato</a>
                            </li>
                        </ul>
                        <div class="btn btn-success">
                            <i class="bi bi-cart"></i>
                            <a class="nav-link" style="display: inline" href="https://store.steampowered.com/app/1845250/Rubinite/">Comprar</a> 
                        </div>
                    </div>
                </nav>
            </div>
        </header>

        <main>
            <section class="contact">
                <div class="container contact-box">
                    <div class="contact-header">
                        <h1 class="text-center">Sugestões</h1>
                        <p>Envie ideias para melhorar este site não oficial!</p>
                    </div>
                    <form action="#" class="contact-form">
                        <div class="form-floating mb-3 mt-3">
                            <input type="email" class="form-control" id="email" placeholder="email" autocomplete="email" name="email">
                            <label for="email">Seu e-mail</label>
                        </div>
    
                        <div class="form-floating mb-3 mt-3">
                            <textarea class="form-control" id="sugestao" name="sugestao" placeholder="sugestao"></textarea>
                            <label for="sugestao">Sugestão</label>
                        </div>

                        <button class="btn-enviar">Enviar</button>
                    </form>
                </div>
            </section>
        </main>
        <footer>

        </footer>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
