<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=width-device, initial-scale=1.0">
        <title>Contato</title>
        <link rel="stylesheet" href="../css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    </head>
    <body>
        <header id="cabecalho">
            <img src="../images/logo.png" alt="Logo da universidade" id="img-uni">
            <nav id="navi">
                <ul>
                <li><a href="../index.html" class="nav-links"><h3 class="text-links">Home</h3></a></li>
                <li><a href="sobre.html"  class="nav-links"><h3 class="text-links">Sobre</h3></a></li>
                <li><a href="contato.html" class="selecionado" class="nav-links"><h3  class="text-links">Contato</h3></a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="banner">
                <div class="banner-content">
                  <p>FALE CONOSCO</p>
                  <h1>Entre em contato com a UNES</h1>
                </div>
              </section>

            <section id="info-contato">
                <div id="info-column1">
                    <h2><span class="txt_underline">Env</span>ie sua mensagem</h2><br>
                        <form id="form-contato">
                            <label for="femail">Seu e-mail</label>
                            <input type="text" id="femail" name="femail" placeholder="voce@email.com"><br>
                            <label for="fassunto">Assunto</label>
                            <input type="text" id="fassunto" name="fassunto" placeholder="Assunto da mensagem"><br>
                            <label for="fdesc">Descrição</label>
                            <textarea id="fdesc" placeholder="Escreva sua mensagem aqui..."></textarea><br>
                            <button id="fenviar">Enviar</button>
                        </form>
                </div>

                <div id="info-column2">
                    <h2><span class="txt_underline">Out</span>ros canais</h2>
                    <ol>
                        <li>
                            <div>
                                <h3>E-mail</h3>
                                <p>contato@unes.edu.br</p>
                            </div>
                        </li>

                        <li>
                            <div>
                                <h3>Telefone</h3>
                                <p>(00) 0000-0000</p>
                            </div>
                        </li>
                        
                        <li>
                            <div>
                                <h3>Endereço</h3>
                                <p>Campus UNES, Bloco Central</p>
                            </div>
                        </li>
                    </ol>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2026 UNES Universidade — Todos os direitos reservados</p>
        </footer>
    </body>
</html>
